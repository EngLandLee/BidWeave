name: Bug report
description: Report a reproducible defect without confidential tender material.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, private tender documents, or security vulnerabilities. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Include the exact commit/tag and deployment profile.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact redacted commands, API request, or browser steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and logs
      description: Redact secrets and private data; include explicit dependency outage responses.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker/Compose, service versions.
    validations:
      required: true

# Purpose: scrape local gateway and API metrics when observability profile is enabled.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: bidweave-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:8000"]

# Extend Keycloak's shipped login templates so authentication, CSRF, required
# actions, and OIDC flow handling remain owned by Keycloak.
parent=keycloak
import=common/keycloak

styles=css/login.css css/bidweave.css
scripts=js/theme.js
locales=vi,en

# Keep the inherited PatternFly resources available to all login and action pages.
# The BidWeave stylesheet is loaded last so these values are presentation-only.
